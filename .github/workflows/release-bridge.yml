name: Release Bridge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v0.1.15)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-nfe-agendamento
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validar versão
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "A release deve ser executada a partir da branch main. Ref atual: $env:GITHUB_REF"
          }

          $raw = $env:INPUT_VERSION.Trim()
          if ($raw -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Versão inválida. Use o formato v1.2.3.'
          }

          $normalized = $raw.TrimStart('v','V')
          $requested = [version]$normalized
          $tag = "v$normalized"

          git fetch --tags --force
          if (git tag --list $tag) {
            throw "A versão $tag já existe."
          }

          $versions = git tag --list 'v*.*.*' | ForEach-Object {
            $candidate = $_.TrimStart('v','V')
            $parsed = $null
            if ([version]::TryParse($candidate, [ref]$parsed)) { $parsed }
          }

          if ($versions) {
            $latest = $versions | Sort-Object -Descending | Select-Object -First 1
            if ($requested -le $latest) {
              throw "A nova versão deve ser maior que v$latest. Solicitada: $tag."
            }
          }

          "version=$normalized" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restaurar dependências
        run: dotnet restore Nfe-Agendamento.sln

      - name: Auditar dependências NuGet
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'nuget-vulnerabilities.json'
          dotnet list Nfe-Agendamento.sln package --vulnerable --include-transitive --format json | Out-File -FilePath $reportPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao executar a auditoria de dependências NuGet.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $findings = @()
          foreach ($project in @($report.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($null -ne $package -and @($package.vulnerabilities).Count -gt 0) {
                  $findings += "$($project.path): $($package.id) $($package.resolvedVersion)"
                }
              }
            }
          }
          if ($findings.Count -gt 0) {
            $findings | ForEach-Object { Write-Error $_ }
            throw 'Dependências NuGet vulneráveis encontradas.'
          }

      - name: Executar testes .NET
        run: dotnet test Nfe-Agendamento.sln -c Release --no-restore

      - name: Testar regressão de produtos Fernando Klein
        run: node tests/js/product-mapping-regression.test.js

      - name: Testar feedback de erros fiscais
        run: node tests/js/lookup-feedback-regression.test.js

      - name: Testar contingência pelo Portal NF-e
        run: node tests/js/portal-fallback-regression.test.js

      - name: Testar botão de consulta durante bootstrap
        run: node tests/js/pairing-lookup-regression.test.js

      - name: Testar consulta em lote
        run: node tests/js/batch-lookup-regression.test.js

      - name: Testar prontidão dos workflows de release
        run: node tests/js/release-readiness-regression.test.js

      - name: Compilar solução
        run: dotnet build Nfe-Agendamento.sln -c Release --no-restore

      - name: Publicar pacote Windows
        shell: pwsh
        run: |
          dotnet publish src/NfeAgendamento.App/NfeAgendamento.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/nfe-agendamento
          Compress-Archive -Path artifacts/nfe-agendamento/* -DestinationPath artifacts/Nfe-Agendamento-win-x64.zip

      - name: Assinar pacote Windows
        shell: pwsh
        env:
          NFE_UPDATE_SIGNING_KEY_PKCS8_B64: ${{ secrets.NFE_UPDATE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NFE_UPDATE_SIGNING_KEY_PKCS8_B64)) {
            throw 'O Secret NFE_UPDATE_SIGNING_KEY_PKCS8_B64 não está configurado. A release não será publicada sem assinatura.'
          }

          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Nfe-Agendamento-win-x64.zip'
          $signaturePath = "$packagePath.sig"
          $expectedPublicKeyFingerprint = '98cba72b2874a069a8eb8553dbd5c0851e52051ceae013b7c1b00917ede9e2d4'
          $privateKeyBytes = $null
          $publicKeyBytes = $null
          $signature = $null
          $rsa = $null

          try {
            $privateKeyBytes = [Convert]::FromBase64String($env:NFE_UPDATE_SIGNING_KEY_PKCS8_B64.Trim())
            $rsa = [System.Security.Cryptography.RSA]::Create()
            $bytesRead = 0
            $rsa.ImportPkcs8PrivateKey($privateKeyBytes, [ref]$bytesRead)
            if ($bytesRead -ne $privateKeyBytes.Length) {
              throw 'A chave privada de assinatura contém dados extras ou inválidos.'
            }

            $publicKeyBytes = $rsa.ExportSubjectPublicKeyInfo()
            $publicHash = [System.Security.Cryptography.SHA256]::HashData($publicKeyBytes)
            $actualFingerprint = [Convert]::ToHexString($publicHash).ToLowerInvariant()
            [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($publicHash)
            if ($actualFingerprint -ne $expectedPublicKeyFingerprint) {
              throw 'O Secret de assinatura não corresponde à chave pública embutida no aplicativo.'
            }

            $packageBytes = [IO.File]::ReadAllBytes($packagePath)
            try {
              $signature = $rsa.SignData(
                $packageBytes,
                [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                [System.Security.Cryptography.RSASignaturePadding]::Pss)
            }
            finally {
              [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($packageBytes)
            }

            [IO.File]::WriteAllText(
              $signaturePath,
              [Convert]::ToBase64String($signature),
              [Text.Encoding]::ASCII)
          }
          finally {
            if ($null -ne $signature) {
              [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($signature)
            }
            if ($null -ne $publicKeyBytes) {
              [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($publicKeyBytes)
            }
            if ($null -ne $privateKeyBytes) {
              [System.Security.Cryptography.CryptographicOperations]::ZeroMemory($privateKeyBytes)
            }
            if ($null -ne $rsa) {
              $rsa.Dispose()
            }
            Remove-Item Env:NFE_UPDATE_SIGNING_KEY_PKCS8_B64 -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw 'A assinatura destacada não foi criada.'
          }

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" artifacts/Nfe-Agendamento-win-x64.zip artifacts/Nfe-Agendamento-win-x64.zip.sig --target "${{ github.sha }}" --title "NFe Agendamento ${{ steps.version.outputs.tag }}" --notes "Pacote Windows autocontido do NFe Agendamento, protegido por SHA-256 e assinatura RSA-PSS/SHA-256."
