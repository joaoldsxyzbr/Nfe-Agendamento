<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFe Agendamento</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <h1>NFe Agendamento</h1>
      <p class="muted">Consulta local de NF-e por chave de acesso.</p>
    </header>
    <section class="card">
      <div class="certificate-row">
        <div>
          <label for="certificateSelect">Certificado</label>
          <select id="certificateSelect">
            <option value="">Selecione um certificado...</option>
          </select>
          <p id="certificateStatus" class="muted"></p>
        </div>
        <button id="saveCertificate" type="button">Salvar</button>
      </div>
      <label for="accessKey">Chave de acesso</label>
      <div class="lookup-row">
        <input id="accessKey" inputmode="numeric" maxlength="44" autocomplete="off" placeholder="Digite os 44 dígitos">
        <button id="lookup" type="button">Consultar</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="actions" class="actions" hidden>
        <button id="viewDanfe" type="button">Visualizar DANFE</button>
        <button id="printDanfe" type="button">Imprimir / Salvar PDF</button>
        <button id="view" type="button">Visualizar XML</button>
        <button id="download" type="button">Baixar XML</button>
      </div>
      <hr>
      <label for="batchKeys">Consulta em lote</label>
      <textarea id="batchKeys" rows="5" placeholder="Cole uma chave por linha, até 100"></textarea>
      <button id="batchLookup" type="button">Consultar lote e baixar ZIP</button>
      <p id="batchStatus" class="status" aria-live="polite"></p>
    </section>
    <section id="danfe" class="danfe" hidden></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
