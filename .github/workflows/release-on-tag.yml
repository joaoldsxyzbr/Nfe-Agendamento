name: Release on tag

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testar e publicar
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v','V')
          dotnet restore Nfe-Agendamento.sln
          dotnet test Nfe-Agendamento.sln -c Release --no-restore
          dotnet publish src/NfeAgendamento.App/NfeAgendamento.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/nfe-agendamento
          Compress-Archive -Path artifacts/nfe-agendamento/* -DestinationPath artifacts/Nfe-Agendamento-win-x64.zip
      - name: Criar release de teste
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${env:GITHUB_REF_NAME}" artifacts/Nfe-Agendamento-win-x64.zip --target main --title "NFe Agendamento ${env:GITHUB_REF_NAME}" --notes "Release de teste da central interna pela rede e do domínio nfeagendamento.local."
