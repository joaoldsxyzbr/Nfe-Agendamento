name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Nfe-Agendamento.sln
      - run: dotnet test Nfe-Agendamento.sln -c Release --no-restore
      - name: Testar regressão de produtos Fernando Klein
        run: node tests/js/product-mapping-regression.test.js
      - run: dotnet build Nfe-Agendamento.sln -c Release --no-restore
      - name: Publicar pacote de teste Windows
        run: dotnet publish src/NfeAgendamento.App/NfeAgendamento.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/nfe-agendamento
      - name: Compactar pacote
        shell: pwsh
        run: Compress-Archive -Path artifacts/nfe-agendamento/* -DestinationPath artifacts/Nfe-Agendamento-win-x64.zip
      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Nfe-Agendamento-win-x64
          path: artifacts/Nfe-Agendamento-win-x64.zip
          if-no-files-found: error
