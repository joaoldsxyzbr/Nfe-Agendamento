name: Release Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER') &&
      startsWith(github.event.comment.body, '/release ')
    runs-on: windows-latest
    steps:
      - name: Interpretar comando
        id: command
        shell: pwsh
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          $parts = $env:COMMENT -split '\s+'
          if ($parts.Count -ne 2) { throw 'Use: /release v1.0.0' }
          $version = $parts[1]
          if ($version -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Versão inválida. Use v1.0.0.' }
          $normalized = $version.TrimStart('v','V')
          "version=$normalized" >> $env:GITHUB_OUTPUT
          "tag=v$normalized" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testar e publicar
        shell: pwsh
        run: |
          dotnet restore Nfe-Agendamento.sln
          dotnet test Nfe-Agendamento.sln -c Release --no-restore
          dotnet publish src/NfeAgendamento.App/NfeAgendamento.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.command.outputs.version }} -p:AssemblyVersion=${{ steps.command.outputs.version }}.0 -p:FileVersion=${{ steps.command.outputs.version }}.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/nfe-agendamento
          Compress-Archive -Path artifacts/nfe-agendamento/* -DestinationPath artifacts/Nfe-Agendamento-win-x64.zip

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.command.outputs.tag }}" artifacts/Nfe-Agendamento-win-x64.zip --target main --title "NFe Agendamento v${{ steps.command.outputs.version }}" --notes "Pacote Windows autocontido para teste do NFe Agendamento."
