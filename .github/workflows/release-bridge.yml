name: Release Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v0.1.27)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-nfe-agendamento
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validar versão
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "A release deve ser executada a partir da branch main. Ref atual: $env:GITHUB_REF"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $raw = $env:INPUT_VERSION
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $request = Get-Content -LiteralPath '.github/release-request.json' -Raw | ConvertFrom-Json
            $raw = [string]$request.version
          }
          else {
            throw "Evento de release não suportado: $env:GITHUB_EVENT_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw 'Versão da release não informada.'
          }

          $raw = $raw.Trim()
          if ($raw -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Versão inválida. Use o formato v1.2.3.'
          }

          $normalized = $raw.TrimStart('v','V')
          $requested = [version]$normalized
          $tag = "v$normalized"

          $projectText = Get-Content -LiteralPath 'src/NfeAgendamento.App/NfeAgendamento.App.csproj' -Raw
          $projectVersionMatch = [regex]::Match($projectText, '<Version>\s*(\d+\.\d+\.\d+)\s*</Version>')
          if (-not $projectVersionMatch.Success) {
            throw 'O projeto não possui <Version> semântica válida.'
          }

          $projectVersion = $projectVersionMatch.Groups[1].Value
          if ($normalized -ne $projectVersion) {
            throw "Versão solicitada ($normalized) difere de <Version> do projeto ($projectVersion)."
          }

          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar tags do repositório.' }

          if (git tag --list $tag) {
            throw "A versão $tag já existe."
          }

          $versions = git tag --list 'v*.*.*' | ForEach-Object {
            $candidate = $_.TrimStart('v','V')
            $parsed = $null
            if ([version]::TryParse($candidate, [ref]$parsed)) { $parsed }
          }

          if ($versions) {
            $latest = $versions | Sort-Object -Descending | Select-Object -First 1
            if ($requested -le $latest) {
              throw "A nova versão deve ser maior que v$latest. Solicitada: $tag."
            }
          }

          "version=$normalized" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Verificar projeto
        shell: pwsh
        run: ./scripts/verify.ps1 -Restore

      - name: Publicar pacote Windows
        shell: pwsh
        run: |
          dotnet publish src/NfeAgendamento.App/NfeAgendamento.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/nfe-agendamento
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar pacote Windows.' }
          Compress-Archive -Path artifacts/nfe-agendamento/* -DestinationPath artifacts/Nfe-Agendamento-win-x64.zip

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # sigstore/cosign-installer@v4.1.2

      - name: Assinar pacote Windows com Sigstore
        shell: pwsh
        run: |
          cosign sign-blob --yes --bundle artifacts/Nfe-Agendamento-win-x64.zip.sigstore.json artifacts/Nfe-Agendamento-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar pacote com Sigstore.' }

      - name: Verificar assinatura Sigstore antes da publicação
        shell: pwsh
        run: |
          cosign verify-blob artifacts/Nfe-Agendamento-win-x64.zip `
            --bundle artifacts/Nfe-Agendamento-win-x64.zip.sigstore.json `
            --certificate-identity "https://github.com/joaoldsxyzbr/Nfe-Agendamento/.github/workflows/release-bridge.yml@refs/heads/main" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          if ($LASTEXITCODE -ne 0) { throw 'A verificação Sigstore do pacote falhou.' }

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" artifacts/Nfe-Agendamento-win-x64.zip artifacts/Nfe-Agendamento-win-x64.zip.sigstore.json --target "${{ github.sha }}" --title "NFe Agendamento ${{ steps.version.outputs.tag }}" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar release no GitHub.' }
