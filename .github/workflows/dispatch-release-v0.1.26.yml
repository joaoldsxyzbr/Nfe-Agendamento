name: Probe Actions Secret Permission

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-release-v0.1.26.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Testar escrita de Secret com GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh secret set NFE_RELEASE_SIGNING_PROBE --repo joaoldsxyzbr/Nfe-Agendamento --body 'permission-probe'
